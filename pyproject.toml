[project]
name = "gnani-eval"
version = "0.1.0"
description = "Evaluation of Gnani Prisma (ASR) and Timbre (TTS)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "requests",
    "python-dotenv",
    "soundfile",
    "sounddevice",
    "faster-whisper",
    "speechmos",
    "librosa",
]

[dependency-groups]
dev = [
    "pytest",
    "jiwer",
]
